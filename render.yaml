# Render Blueprint — NestJS API (contact form)
# New + → Blueprint → select this repository. Render reads this file and asks for the
# secret values marked `sync: false`. See docs/RENDER.md for the full walkthrough.
services:
  - type: web
    name: jz-portfolio-api
    runtime: node
    plan: free
    rootDir: backend
    # devDependencies are needed to compile (Nest CLI), even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # PostgreSQL connection string (Neon). Secret.
      - key: DATABASE_URL
        sync: false
      # Free tiers block SMTP, so email goes through an HTTPS API provider.
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      # Where notifications arrive. With Resend and no verified domain, this must be the
      # email of the Resend account.
      - key: CONTACT_EMAIL_TO
        sync: false
      # Without a verified domain use onboarding@resend.dev
      - key: CONTACT_FROM_EMAIL
        value: onboarding@resend.dev
      # Browser origins allowed by CORS, comma separated (production domain and Netlify URL).
      - key: FRONTEND_URL
        sync: false
