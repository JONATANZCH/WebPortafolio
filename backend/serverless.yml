service: jz-portfolio-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'prod'}
  memorySize: 256
  timeout: 29

  environment:
    NODE_ENV: production
    DATABASE_URL: ${env:DATABASE_URL, ssm:/jz-portfolio/DATABASE_URL}
    SENDGRID_API_KEY: ${env:SENDGRID_API_KEY, ssm:/jz-portfolio/SENDGRID_API_KEY}
    CONTACT_EMAIL_TO: ${env:CONTACT_EMAIL_TO, 'jonatanzch@gmail.com'}
    # Comma-separated list of allowed browser origins (production site, Netlify URL)
    FRONTEND_URL: ${env:FRONTEND_URL, 'https://jonatanzarate.dev,https://www.jonatanzarate.dev'}
    CONTACT_FROM_EMAIL: ${env:CONTACT_FROM_EMAIL, 'no-reply@jonatanzarate.dev'}

  # CORS: allow requests from the Netlify-hosted frontend
  httpApi:
    cors:
      allowedOrigins:
        - 'https://jonatanzarate.dev'
        - 'https://www.jonatanzarate.dev'
        - 'http://localhost:3000'
      allowedMethods:
        - GET
        - POST
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization

functions:
  api:
    handler: dist/lambda.handler
    description: JZ Portfolio NestJS API — contact form and health check
    events:
      # Root path
      - http:
          path: /
          method: ANY
          cors: true
      # All sub-paths (proxy+ catches /api/contact, /health, etc.)
      - http:
          path: /{proxy+}
          method: ANY
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
    noPrependStageInUrl: true

package:
  individually: false
  patterns:
    - 'dist/**'
    - 'node_modules/**'
    - '!node_modules/.cache/**'
    - '!src/**'
    - '!*.ts'
    - '!*.md'
    - '!.env*'
    - '!test/**'
