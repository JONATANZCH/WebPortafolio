[build]
  base = "frontend"
  command = "npm install --legacy-peer-deps && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.12.0"
  NODE_ENV = "production"
  NEXT_PUBLIC_SANITY_PROJECT_ID = "ohw2y3ub"
  NEXT_PUBLIC_SANITY_DATASET = "production"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/"
  to = "/es"
  status = 302
