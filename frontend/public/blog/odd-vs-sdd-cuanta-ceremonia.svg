    <rect x="168" y="70" width="52" height="64" rx="6"/><rect x="232" y="70" width="52" height="64" rx="6"/>
    <rect x="40" y="150" width="52" height="64" rx="6"/><rect x="104" y="150" width="52" height="64" rx="6"/>
