  <g stroke="#1F4BFF" stroke-width="3" stroke-linecap="round"><path d="M384 90h28M384 104h20M384 118h26"/></g>
  <path d="M424 102h46" stroke="#00A3C4" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/>
