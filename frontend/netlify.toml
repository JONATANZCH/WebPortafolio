[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SANITY_PROJECT_ID = "ohw2y3ub"
  NEXT_PUBLIC_SANITY_DATASET = "production"
  # Set NEXT_PUBLIC_API_URL and NETLIFY_API_URL in the Netlify dashboard
  # Example: NETLIFY_API_URL = "https://api.jonatanzarate.dev"
  # Example: NEXT_PUBLIC_API_URL = "https://api.jonatanzarate.dev"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000

# API proxy: forward /api/* requests to the Lambda backend
# Set NETLIFY_API_URL in the Netlify dashboard (e.g. https://api.jonatanzarate.dev)
[[redirects]]
  from   = "/api/*"
  to     = "${NETLIFY_API_URL}/api/:splat"
  status = 200
  force  = true

  [redirects.headers]
    X-Forwarded-Host = "jonatanzarate.dev"

# SPA fallback — let Next.js handle all unmatched routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
